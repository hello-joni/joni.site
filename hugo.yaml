baseurl: "https://joni-on-micro.site"
locale: "en-us"
title: "Joni's Website"
footnotereturnlinkcontents: "↩"

permalinks:
  blog: "/blog/:year-:month-:day/:slug/"

params:
  author:
    name: Joni Hendrickson
    email: me@joni.site
  description:
    "Joni Hendrickson's MCU-hosted site about tiny software, tiny hardware, and
    tiny robots."
  footer: "Please email me: [contact@joni.site](mailto:contact@joni.site)<br>
    [GitHub](https://github.com/averagewagon) |
    [LinkedIn](https://www.linkedin.com/in/jonathan-r-hendrickson/) |
    [Resume](/resume/) |
    [RSS](/blog/index.xml)"

minify:
  minifyOutput: true

enableRobotsTXT: true

outputs:
  home:
    - html
  section:
    - html
    - rss
  taxonomy:
    - html
  term:
    - html

services:
  rss:
    limit: 5

markup:
  highlight:
    codeFences: true
    guessSyntax: true
    style: "base16-snazzy"
    lineNumbersInTable: false
    tabWidth: 4
  goldmark:
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
# base16-snazzy
